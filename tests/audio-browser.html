<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naval audio audition</title>
<style>
body{background:#0d1821;color:#e9f5fc;font:16px system-ui;max-width:850px;margin:60px auto;padding:24px}h1{font-size:32px}button{background:#234356;color:inherit;border:1px solid #55819b;border-radius:8px;padding:12px 16px;margin:5px;cursor:pointer}pre{white-space:pre-wrap;color:#a8dfca;line-height:1.7}p{color:#a4bbcb}
</style>
<h1>Naval audio · ElevenLabs v3</h1>
<p>Local recordings: three missile launches, two naval guns, hull impact, ocean miss, sinking, jet, torpedo and open sea.</p>
<button id="start">Load and verify sounds</button><button id="mute">Mute</button>
<div id="sounds"></div><pre id="status">Ready. Press Load to unlock audio.</pre>
<script type="module">
import {BattleAudio} from '/static/js/theater/audio.js';
import {SOUND_BANK} from '/static/js/theater/sound-bank.js';
const audio = new BattleAudio();
const status = document.querySelector('#status');
const names = {missile:'Cruiser missile', missileLight:'Light missile', subMissile:'Submarine missile', cannonHeavy:'16-inch cannon', cannon:'5-inch gun', explosion:'Ship hit', splash:'Ocean miss', creak:'Ship sinking', jet:'Jet flyby', torpedo:'Torpedo'};
document.querySelector('#start').onclick = async () => {
    try {
        audio.unlock(); audio.setMuted(false);
        status.textContent = 'Loading local WAV files…';
        await audio.ready;
        const expected = Object.keys(SOUND_BANK).length;
        if (audio.samples.size !== expected) throw new Error(`Only ${audio.samples.size}/${expected} recordings decoded`);
        for (const [key, buffer] of audio.samples) {
            if (buffer.duration <= 0 || !buffer.getChannelData(0).some(v => Math.abs(v) > .001)) throw new Error(`Silent ${key}`);
        }
        // Exercise the actual Web Audio graph at an inaudible master level.
        audio.master.gain.value = 0;
        for (const key of Object.keys(names)) audio.play(key === 'cannonHeavy' ? 'cannon' : key, null, key === 'cannonHeavy' ? 1.5 : 1);
        audio.setMuted(true);
        const count = audio.sampleVoices.size;
        audio.play('missile');
        if (audio.sampleVoices.size !== count) throw new Error('Mute allowed a new voice');
        await new Promise(resolve => setTimeout(resolve, 9000));
        if (audio.sampleVoices.size) throw new Error('Completed voices were not released');
        audio.setMuted(false);
        status.textContent = `PASS: ${expected}/${expected} WAVs decoded, non-silent.\nPASS: all event graphs played and released.\nPASS: mute suppressed new events.\nOcean ambience is looping. Audition individual events below.`;
        document.querySelector('#sounds').replaceChildren();
        for (const [key, name] of Object.entries(names)) {
            const button = document.createElement('button'); button.textContent = name;
            button.onclick = () => {audio.unlock(); audio.play(key === 'cannonHeavy' ? 'cannon' : key, null, key === 'cannonHeavy' ? 1.5 : key === 'jet' || key === 'torpedo' ? 4 : 1);};
            document.querySelector('#sounds').append(button);
        }
    } catch (error) {status.textContent = `FAIL: ${error.message}`;}
};
document.querySelector('#mute').onclick = () => {
    audio.setMuted(!audio.muted);
    document.querySelector('#mute').textContent = audio.muted ? 'Unmute' : 'Mute';
};
</script>
</html>
