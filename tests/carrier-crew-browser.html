<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Carrier crew visual regression</title>
<style>body{margin:0;background:#18232b;color:#edf2f5;font:16px system-ui}header{padding:18px}canvas{display:block}#status{color:#a4e0b2}.labels{display:flex;justify-content:space-around}</style>
<script type="importmap">{"imports":{"three":"/static/vendor/three/three.module.js","three/addons/":"/static/vendor/three/addons/"}}</script>
<header>Carrier crew visual regression · drag to orbit · no API calls
<div class="labels"><span>Previous static silhouette</span><span>New static crew</span><span>Launch director</span><span>Launch shooter</span></div><span id="status">Loading…</span></header>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {deckCrew, carrierSailor, directorPose, shooterPose} from '../static/js/theater/flightdeck.js';
import {ShipBuilder} from '../static/js/theater/shipkit.js';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x18232b);
const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth, innerHeight-100); renderer.setPixelRatio(devicePixelRatio); document.body.append(renderer.domElement);
const camera = new THREE.PerspectiveCamera(38, innerWidth/(innerHeight-100), .01, 100); camera.position.set(9, 6, 13);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0,1.3,0); controls.update();
scene.add(new THREE.HemisphereLight(0xd7e8ff,0x536068,2)); const light = new THREE.DirectionalLight(0xffedda,3); light.position.set(4,8,5); scene.add(light);
const deck = new THREE.Mesh(new THREE.BoxGeometry(17,.12,6), new THREE.MeshStandardMaterial({color:0x48515b,roughness:.9})); deck.position.y=-.06; scene.add(deck);
const jersey = new THREE.MeshStandardMaterial({color:0xd8a21c,roughness:.75});
const old = new THREE.Group(); old.add(new THREE.Mesh(new THREE.CapsuleGeometry(.0036,.012,2,6),jersey)); old.children[0].position.y=.0096;
const head = new THREE.Mesh(new THREE.SphereGeometry(.0028,6,4),new THREE.MeshStandardMaterial({color:0xc9ccca})); head.position.y=.0205; old.add(head); old.scale.setScalar(100); old.position.x=-5.4; scene.add(old);
const b = new ShipBuilder(); b.materials={yellow:jersey,crewSkin:new THREE.MeshStandardMaterial({color:0xb07a58}),black:new THREE.MeshStandardMaterial({color:0x1b1b1c}),dark:new THREE.MeshStandardMaterial({color:0x3c4148}),white:new THREE.MeshStandardMaterial({color:0xd5d8cc})};
carrierSailor(b,0,0,0,'yellow'); const staticCrew=b.build(b.materials).fore; staticCrew.scale.setScalar(100); staticCrew.position.x=-1.8; staticCrew.rotation.y=-.5; scene.add(staticCrew);
const director=deckCrew(jersey,jersey), shooter=deckCrew(jersey,new THREE.MeshStandardMaterial({color:0xc9ccca}));
for(const [crew,x] of [[director,1.8],[shooter,5.4]]){crew.group.scale.setScalar(100);crew.group.position.x=x;crew.group.rotation.y=-.5;crew.base=0;scene.add(crew.group);}
const clock = new THREE.Clock();
renderer.setAnimationLoop(()=>{const t=clock.getElapsedTime();directorPose(director,t);shooterPose(shooter,(t%6)/6,t);controls.update();renderer.render(scene,camera);});
document.querySelector('#status').textContent='Rendered · static batching and both animated poses active';
window.addEventListener('resize',()=>{camera.aspect=innerWidth/(innerHeight-100);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight-100);});
</script></html>
